[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autoshorts"
version = "0.1.0"
description = "Agentic faceless-video factory: topic in, subtitled 9:16 short out. Script -> voiceover -> b-roll -> karaoke captions -> ffmpeg render."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "AutoShorts contributors" }]
keywords = [
  "shorts", "tiktok", "reels", "faceless", "video-automation", "text-to-speech",
  "whisper", "ffmpeg", "content-creation", "agents",
]
dependencies = [
  "httpx>=0.27",
  "python-dotenv>=1.0",
  "PyYAML>=6.0",
  "Pillow>=10.0",
]

[project.optional-dependencies]
# Free, no-API-key voiceover with word-level timings (recommended default).
voice = ["edge-tts>=6.1.18"]
# Get ffmpeg without touching your PATH (huge on Windows).
ffmpeg = ["imageio-ffmpeg>=0.4.9"]
# Local speech-to-text when your TTS engine cannot report word timings.
whisper = ["faster-whisper>=1.0"]
# Local neural voice models.
piper = ["piper-tts>=1.2"]
openai = ["openai>=1.40"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6"]
all = [
  "edge-tts>=6.1.18",
  "imageio-ffmpeg>=0.4.9",
  "faster-whisper>=1.0",
  "pytest>=8.0",
  "ruff>=0.6",
]

[project.scripts]
autoshorts = "autoshorts.cli:main"

[project.urls]
Homepage = "https://github.com/ck526438-lgtm/autoshorts"
Repository = "https://github.com/ck526438-lgtm/autoshorts"
Issues = "https://github.com/ck526438-lgtm/autoshorts/issues"

[tool.setuptools.packages.find]
include = ["autoshorts*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Pinned so a ruff upgrade cannot turn CI red on a new default rule set.
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "C4", "RUF005", "SIM101", "SIM103"]
ignore = ["UP035"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
